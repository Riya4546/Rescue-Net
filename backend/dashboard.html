<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>My Profile</h2>

<p><b>Name:</b> <span id="name"></span></p>
<p><b>Username:</b> <span id="username"></span></p>
<p><b>Phone:</b> <span id="phone"></span></p>
<p><b>Country:</b> <span id="country"></span></p>
<p><b>Email:</b> <span id="email"></span></p>

<button onclick="logout()">Logout</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://cmefmcawnugopzrotrem.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZWZtY2F3bnVnb3B6cm90cmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3MzY3NTIsImV4cCI6MjA4NjMxMjc1Mn0.KJu4XNLPdDp3Zs_fQpzPu-x7scdvoZ0IwMHMUKUGMgI";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  async function loadProfile() {
    // 1️⃣ Get logged-in user
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
      alert("Not logged in");
      window.location.href = "signup.html";
      return;
    }

    // 2️⃣ Fetch profile
    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();

    if (error) {
      alert(error.message);
      return;
    }

    // 3️⃣ Display data
    document.getElementById("name").innerText = data.full_name;
    document.getElementById("username").innerText = data.username;
    document.getElementById("phone").innerText = data.phone;
    document.getElementById("country").innerText = data.country;
    document.getElementById("email").innerText = data.email;
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = "signup.html";
  }

  loadProfile();
</script>

</body>
</html>
