<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueNet | SOS & Queue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #3498db;
            --primary-orange: #e67e22;
            --emergency-red: #e74c3c;
            --bg-light: #f4f7f6;
            --text-dark: #2c3e50;
            --white: #ffffff;
            --border-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(rgba(244, 247, 246, 0.85), rgba(244, 247, 246, 0.85)), 
                        url('https://images.unsplash.com/photo-1509099836639-18ba1795216d?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }

        /* Two-Column Grid Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Form and Queue Shared Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* --- Left Column: Form --- */
        .request-form-card { border-top: 6px solid var(--emergency-red); }
        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header i { font-size: 2.5rem; color: var(--emergency-red); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        input, textarea, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }

        .submit-btn {
            width: 100%; padding: 15px; background: var(--emergency-red); color: white; border: none;
            border-radius: 6px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .submit-btn:hover { background: #c0392b; transform: translateY(-2px); }

        /* --- Right Column: Action Queue --- */
        .queue-card { border-top: 6px solid var(--primary-blue); }
        .queue-title { 
            color: var(--primary-blue); 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .queue-title span { color: #95a5a6; font-weight: normal; }

        .queue-list { max-height: 600px; overflow-y: auto; }

        .queue-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .item-top { display: flex; justify-content: space-between; align-items: center; }
        .user-name { font-weight: 800; color: #333; }
        
        .priority-badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; text-transform: uppercase;
        }
        .critical { background: #fee2e2; color: #ef4444; }
        .low { background: #f3f4f6; color: #6b7280; }

        .item-desc { font-size: 0.85rem; color: #666; margin: 8px 0; }
        .item-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #999; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="portal.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="main-layout">
            
            <div class="glass-card request-form-card">
                <div class="form-header">
                    <i class="fas fa-satellite-dish"></i>
                    <h2>I Need Help</h2>
                </div>

                <form id="sosForm">
                    <div class="form-group">
                        <label>Resource Type</label>
                        <select id="resType">
                            <option>Transport / Vehicle</option>
                            <option>Medical Aid</option>
                            <option>Food / Water</option>
                            <option>Emergency Shelter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Identity / Title</label>
                        <input type="text" id="userName" placeholder="e.g., HARI IS HUNGRY" required>
                    </div>
                    <div class="form-group">
                        <label>Description of Need</label>
                        <textarea id="userDesc" rows="3" placeholder="Describe items needed..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Pickup / Current Location</label>
                        <input type="text" id="userLoc" placeholder="e.g., VIT, Vellore" required>
                    </div>
                    <button type="submit" class="submit-btn">Register Resource Request</button>
                </form>
            </div>

            <div class="glass-card queue-card">
                <div class="queue-title">
                    ACTION QUEUE <span>(NEEDS ATTENTION)</span>
                </div>

                <div class="queue-list" id="queueItems">
                    <div class="queue-item">
                        <div class="item-top">
                            <span class="user-name">HARI IS HUNGRY</span>
                            <span class="priority-badge critical">Critical</span>
                        </div>
                        <p class="item-desc">One Shawarma, Two Pizza and One Bottle Pepsi</p>
                        <div class="item-meta">
                            <span><i class="fas fa-map-marker-alt"></i> VIT, Vellore</span>
                            <span>2/11/2026</span>
                        </div>
                    </div>

                    <div class="queue-item">
                        <div class="item-top">
                            <span class="user-name">Clean water</span>
                            <span class="priority-badge low">Low</span>
                        </div>
                        <p class="item-desc">5-liter water cans needed for family</p>
                        <div class="item-meta">
                            <span><i class="fas fa-map-marker-alt"></i> Chennai</span>
                            <span>2/11/2026</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('sosForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get Form Data
            const name = document.getElementById('userName').value;
            const desc = document.getElementById('userDesc').value;
            const loc = document.getElementById('userLoc').value;
            const date = "2/11/2026"; // Current date placeholder

            // Create New Queue Item
            const queueList = document.getElementById('queueItems');
            const newItem = `
                <div class="queue-item" style="animation: slideIn 0.4s ease-out">
                    <div class="item-top">
                        <span class="user-name">${name}</span>
                        <span class="priority-badge critical">Critical</span>
                    </div>
                    <p class="item-desc">${desc}</p>
                    <div class="item-meta">
                        <span><i class="fas fa-map-marker-alt"></i> ${loc}</span>
                        <span>${date}</span>
                    </div>
                </div>
            `;

            // Insert at the top of the queue
            queueList.insertAdjacentHTML('afterbegin', newItem);

            // Reset form
            this.reset();
            alert("Your request has been added to the Action Queue.");
        });
    </script>
</body>
</html>
