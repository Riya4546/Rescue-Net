<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueNet | Volunteer</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap');
        :root {
            --ops-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
            --ops-fast: 170ms;
            --ops-mid: 260ms;
        }

        body.ops-page {
            font-family: "Manrope", "Trebuchet MS", sans-serif;
            line-height: 1.45;
            background:
                radial-gradient(circle at 12% 16%, rgba(52, 152, 219, 0.15), transparent 32%),
                radial-gradient(circle at 86% 80%, rgba(230, 126, 34, 0.16), transparent 30%),
                linear-gradient(145deg, #edf4fa, #f4f7fa);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body.ops-page .sidebar {
            background: linear-gradient(164deg, #213245 0%, #172635 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 14px 0 34px rgba(15, 24, 34, 0.2);
        }

        body.ops-page .brand {
            font-family: "Sora", "Trebuchet MS", sans-serif;
            letter-spacing: 0.3px;
        }

        body.ops-page .nav-link i {
            width: 1.05rem;
            text-align: center;
        }

        body.ops-page .main-content {
            padding: 24px 26px;
        }

        body.ops-page .btn-back {
            border: 1px solid rgba(26, 48, 74, 0.12);
            box-shadow: 0 8px 24px rgba(31, 55, 82, 0.08);
            transition: transform var(--ops-fast) var(--ops-ease), box-shadow var(--ops-fast) var(--ops-ease);
        }

        body.ops-page .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(31, 55, 82, 0.14);
        }

        body.ops-page .split-view {
            height: calc(100dvh - 96px);
            gap: 22px;
            align-items: stretch;
        }

        body.ops-page .split-view.volunteer-layout {
            grid-template-columns: minmax(280px, 330px) 1fr;
        }

        body.ops-page .card-panel {
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            box-shadow: 0 20px 36px rgba(20, 41, 62, 0.12);
            backdrop-filter: blur(7px);
            padding: 24px;
        }

        body.ops-page .card-panel.orange-top {
            border-top: 5px solid #de7b1e;
        }

        body.ops-page .card-panel.blue-top {
            border-top: 5px solid #338ddf;
        }

        body.ops-page h2 {
            font-family: "Sora", "Trebuchet MS", sans-serif;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: #ebf2f8;
            border: 1px solid #d9e5f0;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 18px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 10px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            font-weight: 700;
            color: #6f8397;
            cursor: pointer;
            transition: all var(--ops-mid) var(--ops-ease);
        }

        .tab-btn:hover {
            color: #23415f;
            background: rgba(255, 255, 255, 0.55);
        }

        .tab-btn.active {
            color: #163552;
            background: #fff;
            box-shadow: 0 8px 18px rgba(31, 63, 96, 0.16);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.28s ease;
        }

        .tab-content.active {
            display: block;
        }

        .active-card {
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.98), rgba(245, 250, 255, 0.93));
            border: 1px solid #c8ddf1;
            border-left: 5px solid #2f8bda;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(26, 46, 67, 0.1);
            transition: transform var(--ops-fast) var(--ops-ease), box-shadow var(--ops-fast) var(--ops-ease);
        }

        .active-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(26, 46, 67, 0.13);
        }

        .roadmap-progress {
            margin: 14px 0;
            background: #e6edf4;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
        }

        .roadmap-bar {
            height: 100%;
            background: linear-gradient(90deg, #2f8bda, #53a7f2);
            transition: width 0.5s;
        }

        .safety-panel {
            margin-top: 10px;
            border-radius: 11px;
            padding: 10px 12px;
            border: 1px solid transparent;
        }

        .safety-panel.safe { background: #ebfbf2; border-color: #bfebd0; }
        .safety-panel.warning { background: #fff5e8; border-color: #f3d5a6; }
        .safety-panel.critical { background: #fdeceb; border-color: #f3b8b1; }

        .safety-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .safety-chip {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .safety-chip.safe { color: #16663d; background: #d3f0e1; }
        .safety-chip.warning { color: #8a5200; background: #ffe4bd; }
        .safety-chip.critical { color: #8d1f15; background: #ffd1cb; }

        .safety-live {
            font-size: 0.8rem;
            color: #3f4d56;
            font-weight: 700;
        }

        .safety-grid {
            font-size: 0.8rem;
            color: #455b70;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3px;
        }

        .safety-alert-note {
            margin-top: 8px;
            color: #a0281c;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn.btn-safety-primary {
            background: linear-gradient(92deg, #2f8bda, #4da1ea);
            color: #fff;
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 0.88rem;
            text-transform: none;
            box-shadow: 0 8px 16px rgba(45, 130, 201, 0.24);
        }

        .btn.btn-safety-secondary {
            background: #edf4fa;
            color: #2c3e50;
            padding: 8px 11px;
            border-radius: 9px;
            font-size: 0.82rem;
            text-transform: none;
            border: 1px solid #cfdeeb;
        }

        .btn.btn-safety-danger {
            background: linear-gradient(92deg, #d45245, #e06a5b);
            color: #fff;
            padding: 8px 11px;
            border-radius: 9px;
            font-size: 0.82rem;
            text-transform: none;
        }

        .btn.btn-safety-clear {
            background: linear-gradient(92deg, #249360, #34ab73);
            color: #fff;
            padding: 8px 11px;
            border-radius: 9px;
            font-size: 0.82rem;
            text-transform: none;
        }

        .volunteer-guide-panel {
            text-align: center;
            height: auto;
        }

        .guide-icon {
            font-size: 4rem;
            color: var(--accent);
        }

        .guide-status {
            background: #e8f8f5;
            color: #27ae60;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .guide-divider {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        .guide-text {
            color: #666;
            font-size: 0.9rem;
        }

        .modal {
            background-color: rgba(14, 24, 36, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #fff;
            margin: 8vh auto;
            border-radius: 14px;
            border-top: 0;
            box-shadow: 0 30px 60px rgba(12, 22, 34, 0.32);
            padding: 24px;
            max-height: 82vh;
            overflow-y: auto;
            animation: modalLift 300ms var(--ops-ease) both;
        }

        .close-modal {
            color: #8da0b3;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .close-modal:hover {
            color: #4a6076;
            transform: scale(1.08);
        }

        .modal-content::-webkit-scrollbar,
        .card-panel::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .modal-content::-webkit-scrollbar-thumb,
        .card-panel::-webkit-scrollbar-thumb {
            background: #c8d7e6;
            border-radius: 999px;
        }

        body.ops-page .nav-link:focus-visible,
        body.ops-page .tab-btn:focus-visible,
        body.ops-page .btn:focus-visible {
            outline: 2px solid rgba(53, 130, 204, 0.6);
            outline-offset: 2px;
        }

        @keyframes modalLift {
            from { opacity: 0; transform: translateY(8px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1120px) {
            body.ops-page .split-view.volunteer-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        @media (max-width: 760px) {
            body.ops-page {
                display: block;
                height: auto;
                overflow: auto;
                min-height: 100dvh;
            }

            body.ops-page .sidebar {
                width: 100%;
                height: auto;
                position: sticky;
                top: 0;
                z-index: 30;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                padding: 10px 10px;
                overflow-x: auto;
            }

            body.ops-page .brand {
                margin-bottom: 0;
                font-size: 1rem;
                white-space: nowrap;
            }

            body.ops-page .nav-link {
                margin-bottom: 0;
                white-space: nowrap;
                border-left: 0;
                border-radius: 999px;
                padding: 8px 10px;
                font-size: 0.78rem;
                background: rgba(255, 255, 255, 0.08);
            }

            body.ops-page .nav-link i {
                margin-right: 4px;
            }

            body.ops-page .nav-link.active,
            body.ops-page .nav-link:hover {
                border-left: 0;
            }

            body.ops-page .main-content {
                margin-left: 0;
                padding: 14px;
                overflow: visible;
            }

            body.ops-page .card-panel {
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <link rel="stylesheet" href="css/ops-unified.css">
    <link rel="stylesheet" href="css/dashboard-shell.css">
</head>
<body class="ops-page volunteer-page">
<template id="legacy-page-template">
    <aside class="sidebar">
        <div class="profile-section">
            <div class="profile-icon">
                <i class="fas fa-user-circle"></i>
            </div>
            <h3>Welcome Back</h3>
            <p>Member Dashboard</p>
        </div>

        <nav class="sidebar-nav">
            <a href="portal.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="get_help.html" class="nav-link"><i class="fas fa-bullhorn"></i> Request Help</a>
            <a href="volunteer.html" class="nav-link active"><i class="fas fa-hand-holding-heart"></i> Volunteer</a>
            <a href="command_center.html" class="nav-link"><i class="fas fa-broadcast-tower"></i> Command Center</a>
            <a href="profilepage.html" class="nav-link"><i class="fas fa-user"></i> Profile Settings</a>
            <a href="get_help.html" class="nav-link"><i class="fas fa-bell"></i> Alerts</a>
            <hr class="nav-divider">
            <a href="index.html" class="nav-link logout"><i class="fas fa-power-off"></i> Logout</a>
        </nav>
    </aside>

    <div class="main-content ops-main">
        <a href="portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Return to Portal</a>

        <div class="split-view volunteer-layout">
            <div class="card-panel orange-top volunteer-guide-panel">
                <div class="guide-icon"><i class="fas fa-user-shield"></i></div>
                <h2>Volunteer Responder</h2>
                <div class="guide-status">ONLINE</div>
                <hr class="guide-divider">
                <p class="guide-text">
                    <strong>Instructions:</strong><br>
                    1. Claim "Urgent Needs"<br>
                    2. Use safety check-ins while active<br>
                    3. Use SOS fail-safe in emergencies<br>
                    4. Update workflow status to completion
                </p>
            </div>

            <div class="card-panel blue-top volunteer-board-panel">
                <div class="tabs">
                    <button class="tab-btn active" onclick="window.switchTab('urgent', event)">Urgent Needs</button>
                    <button class="tab-btn" onclick="window.switchTab('active', event)">My Active Missions</button>
                    <button class="tab-btn" onclick="window.switchTab('history', event)">History</button>
                </div>

                <div id="view-urgent" class="tab-content active">
                    <div id="urgentList">Loading...</div>
                </div>

                <div id="view-active" class="tab-content">
                    <div id="activeList">Loading...</div>
                </div>

                <div id="view-history" class="tab-content">
                    <div id="historyList">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="document.getElementById('detailsModal').style.display='none'">&times;</span>
            
            <h2 id="modalTitle" style="margin-top: 0; color: var(--primary);">Mission Title</h2>
            <div id="modalTags" style="margin-bottom: 20px;"></div>
            
            <p id="modalDesc" style="color: #555; background: #f9f9f9; padding: 15px; border-radius: 6px;">Description...</p>
            
            <h4 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">Mission Roadmap</h4>
            <div id="roadmapContent" class="roadmap-container"></div>

            <div style="margin-top: 30px; text-align: right;">
                <button id="btnClaim" class="btn btn-orange">Claim This Mission</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/volunteerUI.js"></script>
</template>
<div id="react-root"></div>
<script src="js/reactLegacyMount.global.js"></script>
<script>
  window.mountLegacyPage();
</script>
</body>
</html>
