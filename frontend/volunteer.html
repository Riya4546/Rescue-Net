<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RescueNet | Volunteer</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ADDING TABS STYLE (Same as get_help to keep consistency) */
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #95a5a6; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn:hover { background: #f9f9f9; color: var(--primary); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--primary); }
        
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        
        /* CARD TWEAKS FOR ACTIVE MISSIONS */
        .active-card { background: #fff; border: 1px solid #b3e5fc; border-left: 5px solid #29b6f6; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .roadmap-progress { margin: 15px 0; background: #eee; height: 8px; border-radius: 4px; overflow: hidden; }
        .roadmap-bar { height: 100%; background: #29b6f6; transition: width 0.5s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="brand"><i class="fas fa-life-ring"></i> RescueNet</div>
        <a href="portal.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="#" class="nav-link active"><i class="fas fa-hand-holding-heart"></i> Missions</a>
    </nav>

    <div class="main-content" style="background: #eef2f3;">
        <a href="portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Return to Portal</a>

        <div class="split-view volunteer-layout">
            <div class="card-panel orange-top" style="text-align: center; height: auto;">
                <div style="font-size: 4rem; color: var(--accent);"><i class="fas fa-user-shield"></i></div>
                <h2>Volunteer Responder</h2>
                <div style="background: #e8f8f5; color: #27ae60; padding: 5px 15px; border-radius: 20px; display: inline-block; font-weight: bold; font-size: 0.8rem;">ONLINE</div>
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                <p style="color: #666; font-size: 0.9rem;">
                    <strong>Instructions:</strong><br>
                    1. Claim "Urgent Needs"<br>
                    2. Update status in "Active Missions"<br>
                    3. Finish to move to "History"
                </p>
            </div>

            <div class="card-panel blue-top">
                <div class="tabs">
                    <button class="tab-btn active" onclick="window.switchTab('urgent')">Urgent Needs</button>
                    <button class="tab-btn" onclick="window.switchTab('active')">My Active Missions</button>
                    <button class="tab-btn" onclick="window.switchTab('history')">History</button>
                </div>

                <div id="view-urgent" class="tab-content active">
                    <div id="urgentList">Loading...</div>
                </div>

                <div id="view-active" class="tab-content">
                    <div id="activeList">Loading...</div>
                </div>

                <div id="view-history" class="tab-content">
                    <div id="historyList">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="document.getElementById('detailsModal').style.display='none'">&times;</span>
            
            <h2 id="modalTitle" style="margin-top: 0; color: var(--primary);">Mission Title</h2>
            <div id="modalTags" style="margin-bottom: 20px;"></div>
            
            <p id="modalDesc" style="color: #555; background: #f9f9f9; padding: 15px; border-radius: 6px;">Description...</p>
            
            <h4 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">Mission Roadmap</h4>
            <div id="roadmapContent" class="roadmap-container"></div>

            <div style="margin-top: 30px; text-align: right;">
                <button id="btnClaim" class="btn btn-orange">Claim This Mission</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/volunteerUI.js"></script>
</body>
</html>
