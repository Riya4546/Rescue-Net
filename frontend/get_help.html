<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Help</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <nav class="navbar">
        <a href="dashboard.html" class="nav-link" style="margin-left: 0;">&larr; Back to Dashboard</a>
        <div class="brand">Request <span>Assistance</span></div>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            
            <form id="helpForm">
                <div class="form-group">
                    <label>Title of Emergency</label>
                    <input type="text" id="reqTitle" placeholder="e.g., Flooded House, Insulin Needed" required>
                </div>

                <div class="form-group">
                    <label>Urgency Level</label>
                    <select id="reqUrgency" required>
                        <option value="low">Low (Can wait)</option>
                        <option value="medium">Medium (Needed today)</option>
                        <option value="high">High (Urgent)</option>
                        <option value="critical">CRITICAL (Life Threatening)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Type of Help</label>
                    <select id="reqCategory" onchange="window.handleCategoryChange(this.value)" required>
                        <option value="general">General Help</option>
                        <option value="medical">Medical Services</option>
                        <option value="blood">Blood Services</option>
                        <option value="disaster">Disaster / Rescue</option>
                        <option value="food_water">Food & Water</option>
                        <option value="shelter">Shelter Support</option>
                    </select>
                </div>

                <div id="medical-inputs" style="display:none; background: #eff6ff; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <label style="color: var(--blue);">Medical Specifics</label>
                    <select id="medType" style="margin-bottom: 10px;">
                        <option value="assistance">Doctor/Nurse Assistance</option>
                        <option value="medicine">Medicine Needed</option>
                    </select>
                    <input type="text" id="medName" placeholder="Medicine Name (e.g. Paracetamol)" style="margin-bottom: 10px;">
                    <input type="number" id="medQty" placeholder="Quantity (Max 500)" max="500">
                </div>

                <div id="blood-inputs" style="display:none; background: #fef2f2; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <label style="color: var(--danger);">Blood Requirements</label>
                    <select id="bloodGroup" style="margin-bottom: 10px;">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    </select>
                    <input type="number" id="bloodQty" placeholder="Amount (in ml)">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="reqLocation" placeholder="Type to search..." oninput="window.searchLocation(this.value)" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="reqDescription" rows="3" placeholder="Additional details..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="background-color: var(--danger);">Submit Request</button>
            </form>
        </div>

        <div style="margin-top: 40px; max-width: 800px; margin-left: auto; margin-right: auto;">
            <h3 style="border-bottom: 2px solid var(--border); padding-bottom: 10px;">Your Active Requests</h3>
            <div id="listActive" class="card-grid" style="margin-top: 20px;"></div>
            
            <h3 style="margin-top: 30px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">Pending Queue</h3>
             <div id="listQueue" class="card-grid" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script type="module" src="js/dashboardUI.js"></script>

</body>
</html>
