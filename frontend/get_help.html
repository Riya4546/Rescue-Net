<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueNet | Request Help</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. TABBED INTERFACE --- */
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #95a5a6; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn:hover { background: #f9f9f9; color: var(--primary); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--primary); }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 2. INTERACTIVE CARDS --- */
        .status-card { 
            padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; 
            background: white; cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .status-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #ddd; }
        .status-card.queued { border-left: 5px solid var(--danger); }
        .status-card.on_progress { border-left: 5px solid var(--blue); }
        .status-card.completed { border-left: 5px solid var(--success); opacity: 0.7; }
        .status-card.completed:hover { opacity: 1; }
        .click-hint { font-size: 0.7rem; color: #bbb; position: absolute; top: 10px; right: 10px; opacity: 0; transition: 0.2s; }
        .status-card:hover .click-hint { opacity: 1; }

        /* --- 3. MODAL (CASE FILE) STYLES --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { 
            background-color: white; margin: 5vh auto; padding: 0; border-radius: 12px; 
            width: 90%; max-width: 650px; height: 90vh; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow: hidden;
        }
        .modal-header { background: var(--primary); color: white; padding: 20px 25px; display: flex; justify-content: space-between; align-items: start; flex-shrink: 0; }
        .modal-body { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .close-modal { color: white; font-size: 28px; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .close-modal:hover { opacity: 1; transform: scale(1.1); }

        /* --- 4. DETAILS GRID & ROADMAP --- */
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .detail-item label { display: block; font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .detail-item span { font-size: 1rem; color: #333; font-weight: 600; }
        
        .timeline-container { border-top: 1px solid #eee; padding-top: 20px; margin-top: 10px; }
        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #e0e0e0; margin-left: 10px; }
        .timeline-step { position: relative; margin-bottom: 25px; padding-left: 20px; }
        /* The Dot */
        .timeline-step::before { 
            content: ''; position: absolute; left: -27px; top: 2px; 
            width: 14px; height: 14px; border-radius: 50%; background: white; 
            border: 3px solid #ccc; z-index: 2;
        }
        .timeline-step.done::before { border-color: var(--success); background: var(--success); }
        .timeline-step.active::before { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.2); }
        
        .t-title { font-weight: bold; font-size: 0.95rem; color: #444; }
        .t-time { font-size: 0.8rem; color: #888; margin-top: 2px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand"><i class="fas fa-life-ring"></i> RescueNet</div>
        <a href="portal.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="#" class="nav-link active"><i class="fas fa-bullhorn"></i> Request Help</a>
        <a href="volunteer.html" class="nav-link"><i class="fas fa-hand-holding-heart"></i> Volunteer</a>
    </nav>

    <div class="main-content">
        <a href="portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="split-view">
            <div class="card-panel red-top">
                <div style="text-align: center; margin-bottom: 20px;">
                    <i class="fas fa-broadcast-tower" style="font-size: 2rem; color: var(--danger);"></i>
                    <h2 style="margin: 0;">I Need Help</h2>
                </div>
                <form id="helpForm">
                    <div class="form-group">
                        <label class="form-label">Type of Help Needed</label>
                        <select id="reqCategory" class="form-control" onchange="window.handleCategoryChange()" required>
                            <option value="">-- Select Resource --</option>
                            <option value="medical">Medical Assistance</option>
                            <option value="blood">Blood Needed</option>
                            <option value="food_water">Food & Water</option>
                            <option value="disaster">Rescue / Disaster</option>
                            <option value="shelter">Shelter</option>
                        </select>
                    </div>
                    <div id="medical-inputs" style="display:none; background: #eef9f0; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <label class="form-label" style="color: var(--success);">Medical Specifics</label>
                        <select id="medType" class="form-control" style="margin-bottom: 10px;" onchange="window.handleMedicalType()">
                            <option value="">Select Service Type...</option>
                            <option value="assistance">Doctor / Staff</option>
                            <option value="medicine">Medicine Supply</option>
                        </select>
                        <div id="doctor-fields" style="display:none;"><input type="text" id="docDept" class="form-control" placeholder="Specialist Required"></div>
                        <div id="medicine-fields" style="display:none;"><input type="text" id="medName" class="form-control" placeholder="Medicine Name" style="margin-bottom:8px;"><input type="number" id="medQty" class="form-control" placeholder="Quantity"></div>
                    </div>
                    <div id="blood-inputs" style="display:none; background: #fadbd8; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <label class="form-label" style="color: var(--danger);">Blood Requirements</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="bloodGroup" class="form-control">
                                <option value="">Group</option>
                                <option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option>
                            </select>
                            <input type="number" id="bloodQty" class="form-control" placeholder="Units (ml)">
                        </div>
                    </div>

                    <div class="form-group"><label class="form-label">Title</label><input type="text" id="reqTitle" class="form-control" placeholder="Brief Title" required></div>
                    <div class="form-group"><label class="form-label">Urgency</label><select id="reqUrgency" class="form-control"><option value="low">Low</option><option value="high">High</option><option value="critical">CRITICAL</option></select></div>
                    <div class="form-group" style="position:relative;"><label class="form-label">Location</label><input type="text" id="reqLocation" class="form-control" required><ul id="location-suggestions" class="suggestions-list"></ul><button type="button" onclick="window.getLocation()" class="btn" style="position:absolute; right:0; top:28px; background:#eee; color:#333;"><i class="fas fa-crosshairs"></i></button></div>
                    <div class="form-group"><label class="form-label">Description</label><textarea id="reqDescription" class="form-control"></textarea></div>
                    <button type="submit" class="btn btn-red btn-block">BROADCAST REQUEST</button>
                </form>
            </div>

            <div class="card-panel blue-top" style="background: #fdfdfd; display: flex; flex-direction: column;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('queue')">Queue</button>
                    <button class="tab-btn" onclick="switchTab('progress')">In Progress</button>
                    <button class="tab-btn" onclick="switchTab('completed')">History</button>
                </div>
                <div id="view-queue" class="tab-content active" style="flex: 1; overflow-y: auto;"><div id="listQueue"></div></div>
                <div id="view-progress" class="tab-content" style="flex: 1; overflow-y: auto;"><div id="listProgress"></div></div>
                <div id="view-completed" class="tab-content" style="flex: 1; overflow-y: auto;"><div id="listCompleted"></div></div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="d-title" style="margin: 0; font-size: 1.4rem;">...</h2>
                    <span id="d-status" class="badge" style="background: rgba(255,255,255,0.25); margin-top: 5px; display:inline-block;">...</span>
                </div>
                <span class="close-modal" onclick="document.getElementById('detailModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item"><label>Category</label><span id="d-category">...</span></div>
                    <div class="detail-item"><label>Registered At</label><span id="d-date">...</span></div>
                    <div class="detail-item"><label>Specific Details</label><span id="d-specifics">...</span></div>
                    <div class="detail-item"><label>Volunteer</label><span id="d-volunteer" style="color: var(--blue);">...</span></div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight:bold; color:#666; font-size:0.8rem; text-transform:uppercase;">Location</label>
                    <div id="d-location" style="background: #eee; padding: 10px; border-radius: 6px; margin-top: 5px;"><i class="fas fa-map-marker-alt"></i> <span>...</span></div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight:bold; color:#666; font-size:0.8rem; text-transform:uppercase;">Description</label>
                    <p id="d-desc" style="color: #444; background:#f9f9f9; padding:15px; border-radius:6px; margin-top:5px;">...</p>
                </div>

                <div class="timeline-container">
                    <h4 style="margin: 0 0 15px 0; color: var(--primary);"><i class="fas fa-route"></i> Live Roadmap</h4>
                    <div id="d-roadmap" class="timeline">
                        </div>
                </div>
            </div>
        </div>
    </div>

 <script type="module" src="js/requestHelpUI.js"></script>
