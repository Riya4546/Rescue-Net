<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueNet | Request Help</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap');
        :root {
            --ops-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
            --ops-fast: 170ms;
            --ops-mid: 260ms;
        }

        body.ops-page {
            font-family: "Manrope", "Trebuchet MS", sans-serif;
            line-height: 1.45;
            background:
                radial-gradient(circle at 16% 14%, rgba(52, 152, 219, 0.15), transparent 34%),
                radial-gradient(circle at 82% 82%, rgba(230, 126, 34, 0.12), transparent 30%),
                linear-gradient(145deg, #edf4fa, #f4f7fa);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body.ops-page .sidebar {
            background: linear-gradient(164deg, #213245 0%, #172635 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 14px 0 34px rgba(15, 24, 34, 0.2);
        }

        body.ops-page .brand {
            font-family: "Sora", "Trebuchet MS", sans-serif;
            letter-spacing: 0.3px;
        }

        body.ops-page .nav-link i {
            width: 1.05rem;
            text-align: center;
        }

        body.ops-page .main-content {
            padding: 24px 26px;
        }

        body.ops-page .btn-back {
            border: 1px solid rgba(26, 48, 74, 0.12);
            box-shadow: 0 8px 24px rgba(31, 55, 82, 0.08);
            transition: transform var(--ops-fast) var(--ops-ease), box-shadow var(--ops-fast) var(--ops-ease);
        }

        body.ops-page .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(31, 55, 82, 0.14);
        }

        body.ops-page .split-view {
            height: calc(100dvh - 96px);
            gap: 22px;
            align-items: stretch;
        }

        body.ops-page .card-panel {
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            box-shadow: 0 20px 36px rgba(20, 41, 62, 0.12);
            backdrop-filter: blur(7px);
            padding: 24px;
        }

        body.ops-page .form-group {
            margin-bottom: 16px;
        }

        body.ops-page .card-panel.red-top {
            border-top: 5px solid #d95f4e;
        }

        body.ops-page .card-panel.blue-top {
            border-top: 5px solid #338ddf;
        }

        body.ops-page h2 {
            font-family: "Sora", "Trebuchet MS", sans-serif;
        }

        body.ops-page .form-label {
            color: #698094;
            letter-spacing: 0.7px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        body.ops-page .form-control {
            border-radius: 10px;
            border: 1px solid #d5e0ea;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: inset 0 1px 2px rgba(28, 44, 62, 0.04);
        }

        body.ops-page .form-control:focus {
            border-color: #3f93dd;
            box-shadow: 0 0 0 4px rgba(63, 147, 221, 0.12);
        }

        body.ops-page .btn-red {
            background: linear-gradient(92deg, #d85a4b, #ea7658);
            border-radius: 12px;
            letter-spacing: 0.7px;
        }

        body.ops-page .btn-red:hover {
            background: linear-gradient(92deg, #c94f42, #de684a);
        }

        .panel-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .panel-header-icon {
            font-size: 2rem;
            color: var(--danger);
        }

        .panel-header-title {
            margin: 0;
        }

        .resource-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .resource-box.medical {
            background: #eef9f0;
        }

        .resource-box.blood {
            background: #fadbd8;
        }

        .medical-label {
            color: var(--success);
        }

        .blood-label {
            color: var(--danger);
        }

        .locate-btn {
            position: absolute;
            right: 0;
            top: 28px;
            background: #eee;
            color: #333;
        }

        .request-feed-panel {
            display: flex;
            flex-direction: column;
        }

        body.ops-page .tabs {
            display: flex;
            gap: 8px;
            background: #ebf2f8;
            border: 1px solid #d9e5f0;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 18px;
        }

        body.ops-page .tab-btn {
            flex: 1;
            padding: 10px 10px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            font-weight: 700;
            color: #6f8397;
            cursor: pointer;
            transition: all var(--ops-mid) var(--ops-ease);
        }

        body.ops-page .tab-btn:hover {
            color: #23415f;
            background: rgba(255, 255, 255, 0.55);
        }

        body.ops-page .tab-btn.active {
            color: #163552;
            background: #fff;
            box-shadow: 0 8px 18px rgba(31, 63, 96, 0.16);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.28s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-card {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #dce6ef;
            margin-bottom: 12px;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.98), rgba(245, 250, 255, 0.93));
            cursor: pointer;
            transition: transform var(--ops-fast) var(--ops-ease), box-shadow var(--ops-fast) var(--ops-ease), border-color var(--ops-fast) ease;
            position: relative;
        }

        .status-card strong {
            line-height: 1.35;
        }

        .status-card:hover {
            transform: translateY(-3px);
            border-color: #bfd6ea;
            box-shadow: 0 14px 24px rgba(24, 46, 68, 0.13);
        }

        .status-card.queued { border-left: 5px solid var(--danger); }
        .status-card.on_progress { border-left: 5px solid var(--blue); }
        .status-card.completed { border-left: 5px solid #2e9f6c; opacity: 0.78; }
        .status-card.completed:hover { opacity: 1; }

        .click-hint {
            font-size: 0.68rem;
            color: #8aa0b5;
            position: absolute;
            top: 9px;
            right: 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .status-card:hover .click-hint {
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(14, 24, 36, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #fff;
            margin: 4vh auto;
            padding: 0;
            border-radius: 16px;
            width: 92%;
            max-width: 760px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 65px rgba(12, 22, 34, 0.34);
            overflow: hidden;
            border-top: 0;
            animation: modalLift 300ms var(--ops-ease) both;
        }

        .modal-header {
            background: linear-gradient(95deg, #21384f, #2f5675);
            color: white;
            padding: 22px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 22px;
            overflow-y: auto;
            flex-grow: 1;
            background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
        }

        .close-modal {
            color: rgba(255, 255, 255, 0.82);
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .close-modal:hover {
            color: #fff;
            transform: scale(1.08);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 22px;
            background: #f4f8fc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #dbe7f1;
        }

        .detail-item label {
            display: block;
            font-size: 0.7rem;
            color: #74879b;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.55px;
            margin-bottom: 4px;
        }

        .detail-item span {
            font-size: 0.94rem;
            color: #2a3f53;
            font-weight: 700;
            line-height: 1.4;
        }

        .timeline-container {
            border-top: 1px solid #d8e4ee;
            padding-top: 16px;
            margin-top: 8px;
        }

        .timeline {
            position: relative;
            padding-left: 16px;
            border-left: 2px solid #d4dee7;
            margin-left: 8px;
        }

        .timeline-step {
            position: relative;
            margin-bottom: 18px;
            padding-left: 18px;
        }

        .timeline-step:last-child {
            margin-bottom: 0;
        }

        .timeline-step::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #c4d2df;
            z-index: 2;
        }

        .timeline-step.done::before { border-color: #2f9c6b; background: #2f9c6b; }
        .timeline-step.active::before { border-color: #2f8bda; background: #2f8bda; box-shadow: 0 0 0 4px rgba(47, 139, 218, 0.18); }
        .timeline-step.safety::before { border-color: #d9852f; background: #d9852f; }
        .timeline-step.alert::before { border-color: #d65043; background: #d65043; box-shadow: 0 0 0 4px rgba(214, 80, 67, 0.18); }
        .timeline-step.alert .t-title { color: #b33c2f; }

        .t-title { font-weight: 700; font-size: 0.92rem; color: #344c62; }
        .t-time { font-size: 0.76rem; color: #7f92a6; margin-top: 2px; }
        .t-note { font-size: 0.79rem; color: #52677d; margin-top: 4px; }

        .modal-body::-webkit-scrollbar,
        .card-panel::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .modal-body::-webkit-scrollbar-thumb,
        .card-panel::-webkit-scrollbar-thumb {
            background: #c8d7e6;
            border-radius: 999px;
        }

        body.ops-page .nav-link:focus-visible,
        body.ops-page .tab-btn:focus-visible,
        body.ops-page .btn:focus-visible {
            outline: 2px solid rgba(53, 130, 204, 0.6);
            outline-offset: 2px;
        }

        @keyframes modalLift {
            from { opacity: 0; transform: translateY(8px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 1120px) {
            body.ops-page .split-view {
                grid-template-columns: 1fr;
                height: auto;
            }

            body.ops-page .card-panel {
                min-height: auto;
            }
        }

        @media (max-width: 760px) {
            body.ops-page {
                display: block;
                height: auto;
                overflow: auto;
                min-height: 100dvh;
            }

            body.ops-page .sidebar {
                width: 100%;
                height: auto;
                position: sticky;
                top: 0;
                z-index: 30;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                padding: 10px 10px;
                overflow-x: auto;
            }

            body.ops-page .brand {
                margin-bottom: 0;
                font-size: 1rem;
                white-space: nowrap;
            }

            body.ops-page .nav-link {
                margin-bottom: 0;
                white-space: nowrap;
                border-left: 0;
                border-radius: 999px;
                padding: 8px 10px;
                font-size: 0.78rem;
                background: rgba(255, 255, 255, 0.08);
            }

            body.ops-page .nav-link i {
                margin-right: 4px;
            }

            body.ops-page .nav-link.active,
            body.ops-page .nav-link:hover {
                border-left: 0;
            }

            body.ops-page .main-content {
                margin-left: 0;
                padding: 14px;
                overflow: visible;
            }

            body.ops-page .card-panel {
                padding: 16px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <link rel="stylesheet" href="css/ops-unified.css">
    <link rel="stylesheet" href="css/dashboard-shell.css">
</head>
<body class="ops-page request-page">
<template id="legacy-page-template">

    <aside class="sidebar">
        <div class="profile-section">
            <div class="profile-icon">
                <i class="fas fa-user-circle"></i>
            </div>
            <h3>Welcome Back</h3>
            <p>Member Dashboard</p>
        </div>

        <nav class="sidebar-nav">
            <a href="portal.html" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="get_help.html" class="nav-link active"><i class="fas fa-bullhorn"></i> Request Help</a>
            <a href="volunteer.html" class="nav-link"><i class="fas fa-hand-holding-heart"></i> Volunteer</a>
            <a href="command_center.html" class="nav-link"><i class="fas fa-broadcast-tower"></i> Command Center</a>
            <a href="profilepage.html" class="nav-link"><i class="fas fa-user"></i> Profile Settings</a>
            <a href="get_help.html" class="nav-link"><i class="fas fa-bell"></i> Alerts</a>
            <hr class="nav-divider">
            <a href="index.html" class="nav-link logout"><i class="fas fa-power-off"></i> Logout</a>
        </nav>
    </aside>

    <div class="main-content ops-main">
        <a href="portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="split-view">
            <div class="card-panel red-top request-form-panel">
                <div class="panel-header">
                    <i class="fas fa-broadcast-tower panel-header-icon"></i>
                    <h2 class="panel-header-title">I Need Help</h2>
                </div>
                <form id="helpForm">
                    <div class="form-group">
                        <label class="form-label">Type of Help Needed</label>
                        <select id="reqCategory" class="form-control" onchange="window.handleCategoryChange()" required>
                            <option value="">-- Select Resource --</option>
                            <option value="medical">Medical Assistance</option>
                            <option value="blood">Blood Needed</option>
                            <option value="food_water">Food & Water</option>
                            <option value="disaster">Rescue / Disaster</option>
                            <option value="shelter">Shelter</option>
                        </select>
                    </div>
                    <div id="medical-inputs" class="resource-box medical" style="display:none;">
                        <label class="form-label medical-label">Medical Specifics</label>
                        <select id="medType" class="form-control" style="margin-bottom: 10px;" onchange="window.handleMedicalType()">
                            <option value="">Select Service Type...</option>
                            <option value="assistance">Doctor / Staff</option>
                            <option value="medicine">Medicine Supply</option>
                        </select>
                        <div id="doctor-fields" style="display:none;">
                            <div style="position:relative;">
                                <input type="text" id="docDept" class="form-control" placeholder="Specialist Required" autocomplete="off">
                                <ul id="specialist-suggestions" class="suggestions-list"></ul>
                            </div>
                        </div>
                        <div id="medicine-fields" style="display:none;">
                            <div style="position:relative; margin-bottom:8px;">
                                <input type="text" id="medName" class="form-control" placeholder="Medicine Name" autocomplete="off">
                                <ul id="medicine-suggestions" class="suggestions-list"></ul>
                            </div>
                            <input type="number" id="medQty" class="form-control" placeholder="Quantity">
                        </div>
                    </div>
                    <div id="blood-inputs" class="resource-box blood" style="display:none;">
                        <label class="form-label blood-label">Blood Requirements</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="bloodGroup" class="form-control">
                                <option value="">Group</option>
                                <option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option>
                            </select>
                            <input type="number" id="bloodQty" class="form-control" placeholder="Units (ml)">
                        </div>
                    </div>

                    <div class="form-group"><label class="form-label">Title</label><input type="text" id="reqTitle" class="form-control" placeholder="Brief Title" required></div>
                    <div class="form-group"><label class="form-label">Urgency</label><select id="reqUrgency" class="form-control"><option value="low">Low</option><option value="high">High</option><option value="critical">CRITICAL</option></select></div>
                    <div class="form-group" style="position:relative;"><label class="form-label">Location</label><input type="text" id="reqLocation" class="form-control" required><ul id="location-suggestions" class="suggestions-list"></ul><button type="button" onclick="window.getLocation()" class="btn locate-btn"><i class="fas fa-crosshairs"></i></button></div>
                    <div class="form-group"><label class="form-label">Description</label><textarea id="reqDescription" class="form-control"></textarea></div>
                    <button type="submit" class="btn btn-red btn-block">BROADCAST REQUEST</button>
                </form>
            </div>

            <div class="card-panel blue-top request-feed-panel">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('queue', event)">Queue</button>
                    <button class="tab-btn" onclick="switchTab('progress', event)">In Progress</button>
                    <button class="tab-btn" onclick="switchTab('completed', event)">History</button>
                </div>
                <div id="view-queue" class="tab-content active" style="flex: 1; overflow-y: auto;"><div id="listQueue"></div></div>
                <div id="view-progress" class="tab-content" style="flex: 1; overflow-y: auto;"><div id="listProgress"></div></div>
                <div id="view-completed" class="tab-content" style="flex: 1; overflow-y: auto;"><div id="listCompleted"></div></div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="d-title" style="margin: 0; font-size: 1.4rem;">...</h2>
                    <span id="d-status" class="badge" style="background: rgba(255,255,255,0.25); margin-top: 5px; display:inline-block;">...</span>
                </div>
                <span class="close-modal" onclick="document.getElementById('detailModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item"><label>Category</label><span id="d-category">...</span></div>
                    <div class="detail-item"><label>Registered At</label><span id="d-date">...</span></div>
                    <div class="detail-item"><label>Specific Details</label><span id="d-specifics">...</span></div>
                    <div class="detail-item"><label>Requester</label><span id="d-requester">...</span></div>
                    <div class="detail-item"><label>Volunteer</label><span id="d-volunteer" style="color: var(--blue);">...</span></div>
                    <div class="detail-item" style="grid-column: 1 / -1;"><label>Responder Safety</label><span id="d-safety">...</span></div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight:bold; color:#666; font-size:0.8rem; text-transform:uppercase;">Location</label>
                    <div id="d-location" style="background: #eee; padding: 10px; border-radius: 6px; margin-top: 5px;"><i class="fas fa-map-marker-alt"></i> <span>...</span></div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight:bold; color:#666; font-size:0.8rem; text-transform:uppercase;">Description</label>
                    <p id="d-desc" style="color: #444; background:#f9f9f9; padding:15px; border-radius:6px; margin-top:5px;">...</p>
                </div>

                <div class="timeline-container">
                    <h4 style="margin: 0 0 15px 0; color: var(--primary);"><i class="fas fa-route"></i> Live Roadmap</h4>
                    <div id="d-roadmap" class="timeline">
                        </div>
                </div>
            </div>
        </div>
    </div>

 <script type="module" src="js/requestHelpUI.js"></script>
</template>
<div id="react-root"></div>
<script src="js/reactLegacyMount.global.js"></script>
<script>
  window.mountLegacyPage();
</script>
</body>
</html>
