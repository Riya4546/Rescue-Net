<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - RescueNet</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="brand">Rescue<span>Net</span> Dashboard</div>
        <a href="index.html" class="nav-link" onclick="return confirm('Log out?');">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </nav>

    <div class="container" style="text-align: center; margin-top: 40px;">
        <h1>How would you like to proceed?</h1>
        <p style="color: var(--gray); margin-bottom: 50px;">Select your mode to continue.</p>

        <div class="card-grid" style="max-width: 900px; margin: 0 auto;">
            
            <div class="card" style="padding: 40px; border-top: 5px solid var(--danger);">
                <i class="fas fa-exclamation-circle" style="font-size: 3rem; color: var(--danger); margin-bottom: 20px;"></i>
                <h2>I Need Help</h2>
                <p style="margin-bottom: 30px; color: #666;">Request medical aid, food, or rescue for yourself or others.</p>
                <a href="get_help.html" class="btn btn-primary" style="background-color: var(--danger);">
                    Go to Request Form &rarr;
                </a>
            </div>

            <div class="card" style="padding: 40px; border-top: 5px solid var(--success);">
                <i class="fas fa-hand-holding-heart" style="font-size: 3rem; color: var(--success); margin-bottom: 20px;"></i>
                <h2>I Can Help</h2>
                <p style="margin-bottom: 30px; color: #666;">View active requests nearby and accept missions.</p>
                <a href="volunteer.html" class="btn btn-success">
                    Go to Volunteer Mode &rarr;
                </a>
            </div>

        </div>
    </div>

</body>
</html>
