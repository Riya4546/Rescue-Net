<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RescueNet | Dashboard</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="dashboard-container">
        <header class="dash-header">
            <h1>Control Center</h1>
            <div class="dash-stats">
                <div class="stat-box blue-border">
                    <span class="stat-label">Active Requests</span>
                    <span id="activeCount" class="stat-value">0</span>
                </div>
                <div class="stat-box orange-border">
                    <span class="stat-label">Urgent Needs</span>
                    <span id="urgentCount" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Resources</span>
                    <span id="resourceCount" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <div class="dash-layout">
            <section class="dash-panel action-panel">
                <div class="card">
                    <div class="tab-controls">
                        <button id="tabNeedHelp" class="tab-btn active">I Need Help</button>
                        <button id="tabCanHelp" class="tab-btn">I Can Help</button>
                    </div>

                    <div id="needHelpSection">
                        <form id="helpForm" class="form-container">
                            <input type="text" id="reqTitle" placeholder="Request Title" required>
                            <select id="reqUrgency">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                            <input type="text" id="reqLocation" placeholder="Location" required>
                            <textarea id="reqDescription" placeholder="Description"></textarea>
                            <button type="submit" id="submitRequestBtn" class="btn-primary">Post Request</button>
                        </form>
                    </div>

                    <div id="canHelpSection" style="display:none;">
                        <form id="resourceForm" class="form-container">
                            <input type="text" id="resTitle" placeholder="Resource Name" required>
                            <select id="resType">
                                <option value="food">Food/Water</option>
                                <option value="medical">Medical</option>
                                <option value="tools">Tools</option>
                            </select>
                            <input type="number" id="resQty" placeholder="Quantity" required>
                            <input type="text" id="resLocation" placeholder="Pickup Location" required>
                            <button type="submit" id="submitResourceBtn" class="btn-primary" style="background:var(--blue)">Offer Resource</button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="dash-panel feed-panel">
                <div class="card">
                    <h3>Live Field Feed</h3>
                    <div id="requestsList" class="feed-list"></div>
                </div>
            </section>
        </div>
    </main>
    <script type="module" src="js/dashboardUI.js"></script>
</body>
</html>
