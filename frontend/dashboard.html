<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RescueNet Dashboard</title>

  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <main class="dashboard">
    <h1>Welcome back, Guest</h1>
    <p class="subtitle">Manage your requests and coordinate relief efforts.</p>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <strong id="activeCount">0</strong>
        <span>Active Requests</span>
      </div>
      <div class="stat-card">
        <strong id="urgentCount">0</strong>
        <span>Urgent Needs</span>
      </div>
      <div class="stat-card">
        <strong id="resourceCount">0</strong>
        <span>Resources Offered</span>
      </div>
    </div>

    <!-- TOGGLE -->
    <div class="toggle">
      <button id="needHelpBtn" class="active">I Need Help</button>
      <button id="canHelpBtn">I Can Help</button>
    </div>

    <section class="content">

      <!-- I NEED HELP -->
      <div class="card form-card" id="needHelpSection">
        <h2>Submit Request</h2>

        <input id="title" placeholder="Title" />
        <select id="urgency">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
        <input id="location" placeholder="Location" />
        <textarea id="description" placeholder="Description"></textarea>

        <button id="submitRequest">Broadcast Request</button>
      </div>

      <!-- I CAN HELP -->
      <div class="card form-card" id="canHelpSection" style="display:none">
        <h2>Offer Resource</h2>

        <input id="resourceTitle" placeholder="Resource title" />

        <select id="resourceType">
          <option value="food">Food</option>
          <option value="medical">Medical</option>
          <option value="shelter">Shelter</option>
          <option value="other">Other</option>
        </select>

        <input id="resourceQuantity" type="number" placeholder="Quantity" />
        <input id="resourceLocation" placeholder="Pickup location" />

        <button id="offerResourceBtn">Register Resource</button>
      </div>

      <!-- REQUEST LIST -->
      <div class="card" id="myRequests">
        <h2>My Active Requests</h2>
        <div id="requestsList">You haven't submitted any requests yet.</div>
      </div>

    </section>
  </main>

  <!-- Scripts -->
  <script type="module" src="./js/navbar.js"></script>
  <script type="module" src="./js/dashboardUI.js"></script>

</body>
</html>
