<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueNet Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="dashboard-container">
        <header class="dash-header">
            <h1>Command Center</h1>
            <div class="dash-stats">
                <div class="stat-card blue">
                    <span class="stat-label">Active Cases</span>
                    <span id="activeCount" class="stat-value">0</span>
                </div>
                <div class="stat-card orange">
                    <span class="stat-label">Urgent</span>
                    <span id="urgentCount" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <div class="dash-layout">
            <section>
                <div class="card">
                    <div class="toggle-container">
                        <button id="tabNeedHelp" class="toggle-btn active">I Need Help</button>
                        <button id="tabCanHelp" class="toggle-btn">I Can Help</button>
                    </div>

                    <div id="needHelpSection">
                        <form id="helpForm">
                            <div class="form-group">
                                <label class="stat-label">Situation Title</label>
                                <input type="text" id="reqTitle" placeholder="e.g., Flooding in Apt Block A" required>
                            </div>
                            <div class="form-group">
                                <select id="reqUrgency">
                                    <option value="medium">Medium Priority</option>
                                    <option value="high">High Priority</option>
                                    <option value="critical">CRITICAL / LIFE SAFETY</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <input type="text" id="reqLocation" placeholder="Exact Location / Coordinates" required>
                            </div>
                            <div class="form-group">
                                <textarea id="reqDescription" placeholder="Describe needs (medical, water, rescue)..." rows="3"></textarea>
                            </div>
                            <button type="submit" id="submitRequestBtn" class="btn-submit btn-orange">Broadcast Request</button>
                        </form>
                    </div>

                    <div id="canHelpSection" style="display:none;">
                        <form id="resourceForm">
                            <div class="form-group">
                                <label class="stat-label">Resource Type</label>
                                <select id="resType">
                                    <option value="food">Food & Water</option>
                                    <option value="medical">Medical Supplies</option>
                                    <option value="transport">Transport / Vehicle</option>
                                    <option value="shelter">Shelter Space</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <input type="text" id="resTitle" placeholder="Item Name (e.g., 20L Water Can)" required>
                            </div>
                            <div class="form-group">
                                <input type="number" id="resQty" placeholder="Quantity Available" required>
                            </div>
                            <div class="form-group">
                                <input type="text" id="resLocation" placeholder="Pickup Location" required>
                            </div>
                            <button type="submit" id="submitResourceBtn" class="btn-submit btn-blue">Register Resource</button>
                        </form>
                    </div>
                </div>
            </section>

            <section>
                <div class="card" style="min-height: 500px;">
                    <div id="viewMyRequests">
                        <div class="feed-header">My Active Requests</div>
                        <div id="listMyActive"></div>
                        
                        <div class="feed-header" style="margin-top: 30px;">Request History</div>
                        <div id="listMyHistory"></div>
                    </div>

                    <div id="viewVolunteer" style="display:none;">
                        <div class="feed-header" style="color: var(--primary-blue);">Action Queue (Needs Attention)</div>
                        <div id="listQueue"></div>

                        <div class="feed-header" style="margin-top: 30px;">Community History</div>
                        <div id="listHistory"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/dashboardUI.js"></script>
</body>
</html>
