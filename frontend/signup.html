<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RescueNet | Join Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
  --primary-blue: #2c7ebf;
  --primary-orange: #e87a41;
  --bg-light: #f4f7f9;
  --text-dark: #1a1a1a;
  --border-light: #ddd;
}


    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      background: linear-gradient(135deg, #e9f2f9, #fdfefe);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .signup-container {
      background: #ffffff;
      width: 100%;
      max-width: 700px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      border-radius: 8px;
      min-height: 500px;
    }

    .brand {
      margin-bottom: 30px;
      border-left: 5px solid var(--primary-blue);
      padding-left: 15px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .brand span {
      color: var(--primary-blue);
    }

    .brand p {
      margin-top: 5px;
      font-size: 0.9rem;
      color: #666;
    }

    label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #777;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      font-size: 0.95rem;
      margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 2px rgba(44,126,191,0.15);
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--primary-orange);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #d96f39;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    .footer a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
<template id="legacy-page-template">

  <div class="signup-container">

    <div class="brand">
      <h1>Join <span>RescueNet</span></h1>
      <p>Be part of a network that saves lives.</p>
    </div>

    <form id="signupForm">

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required />

      <button id="submitBtn" type="submit">Create Account</button>

    </form>

    <div class="footer">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";

    const form = document.getElementById("signupForm");
    const btn = document.getElementById("submitBtn");
    let loading = false;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (loading) return;

      loading = true;
      btn.disabled = true;
      btn.innerText = "Creating account...";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        reset();
        return;
      }

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert(error.message || "Signup failed.");
        reset();
        return;
      }

      alert("Signup successful.");
      window.location.href = "portal.html";
    });

    function reset() {
      loading = false;
      btn.disabled = false;
      btn.innerText = "Create Account";
    }
  </script>

</template>
<div id="react-root"></div>
<script src="js/reactLegacyMount.global.js"></script>
<script>
  window.mountLegacyPage();
</script>
</body>
</html>
